<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>국민 독서 실태</title>
        <!--핸드폰 사진 참조-->
        <style>
            table {
                border: 3px; width: 500px; height: 500px;
                border-collapse: separate;
                table-layout: fixed;
            }
        </style>
    </head>
    <body>
        <table>
            <caption>2015 국민 독서실태</caption>

            <tr>구분
                <th>독서율</th>
                <td>65.3%</td>
                <td>94.9%</td>
            </tr>    
            <tr>성인
                <th>연평균 독서량</th>  
                <td>9.1권</td>
                <td>29.8권</td>  
            </tr>
            <tr>학생
                <th>공공도서관 이용률</th>
                <td>28.2%</td>
                <td>64.9%</td>
            </tr>
        </table>
    </body>
</html>
