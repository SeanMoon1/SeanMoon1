<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>국민 독서 실태</title>
        <!--핸드폰 사진 참조-->
        <style>
            table {
                border: 5px;
                border-collapse: separate;
                table-layout: auto;
                border-color:#000000;
            }
            tr {
                text-align : center;
            }
            th {
                width: 250px; height: 27px;
                background-color: lightslategrey;
            }
        </style>
    </head>
    <body>
        <table>
            <caption>2015 국민 독서실태</caption>
            <tr>
                <th>구분</th>
                <th>성인</th>
                <th>학생</th>
            </tr>
            <tr>
                <th>독서율</th>
                <td>65.3%</td>
                <td>94.9%</td>
            </tr>    
            <tr>
                <th>연평균 독서량</th>  
                <td>9.1권</td>
                <td>29.8권</td>  
            </tr>
            <tr>
                <th>공공도서관 이용률</th>
                <td>28.2%</td>
                <td>64.9%</td>
            </tr>
        </table>
    </body>
</html>
