<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>반복문 학습</title>
        <style>

        </style>
    </head>
    <body>
        <script>
            //구구단 출력
            for ( let i = 2; i < 10; i++) {
                console.log(`${i}단`);
                for ( let k = 1; k < 10; k++) {
                    console.log (`${i}*${k} = ${i*k}`);
                }
                console.log();
            }
            
            // * 출력 방법 1
           for ( let i = 0; i < 5; i++ ) {
            console.log("*".repeat(i + 1 ));
           }

            // * 출력 방법 2
           let star = "";
           for ( let i = 0; i < 5; i++) {
            star = star + "*";
            console.log(star);
           }

            // * 출력 방법 3
            const num = prompt("숫자를 입력하시오: ");
            let mark = "";

            for (let i = 1; i <= num; i++) {
            for (let j = 1; j <= i; j++) {
                mark += "*";
            }
            mark += "<br>";
            }

            document.write(mark);
        </script>
    </body>
</html>
