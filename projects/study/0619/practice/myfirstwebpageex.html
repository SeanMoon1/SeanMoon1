<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My first web page practice.</title>
        <style>
            nav {
                background-color: #FF0000;
                float: left;
            }
            main {
                background-color: #00FF00;

        <main>
            <article>
                <h2>HTML이란?</h2>
                <p> HTML은 웹 페이지를 만드는데 있어서 틀과 구조를 잡는데 사용되는 파일을 의미한다.</p>
            </article>
            <article>
                <h2>CSS란?</h2>

            <article>
                <h2>Java Script란?</h2>
                <p> Java Script 는 웹 페이지의 동적 요소를 만드는데 사용되는 파일이다.</p>
