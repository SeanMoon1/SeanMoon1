<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h2>Table example</h2>

    <table border="1" width="500" height="500">
        <!--border 표 선을 그리는 태그이다.-->
        <tr>
            <th>번호</th>
            <th>이름</th>
            <th>나이</th>
        </tr>
        <!--th는 표의 제목을 나타내는 태그이다.-->
        <tr>
            <td>1</td>
            <td>홍길동</td>
            <td>20</td>
        </tr>
        <!--td는 표의 데이터를 나타내는 태그이다.-->
        <tr>
            <td>2</td>
            <td>이순신</td>
            <td>30</td>
        </tr>
        <tr>    
            <td>3</td>
            <td>강감찬</td>
            <td>40</td>
        </tr>    
    </table>
</body>
</html>
