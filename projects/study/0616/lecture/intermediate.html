<html>
    <head>
        <title>Intermediate</title>
    </head>
    <body>
        <h1>Intermediate</h1>

        <table border="1" width="350" height="200">
            <caption>
                <h2>테이블 예제</h2>
            </caption>

            <thead></thead>
            <!-- thead는 표의 머리글을 나타내는 태그이다. -->
            <tbody></tbody>
            <!-- tbody는 표의 본문을 나타내는 태그이다. -->
            <tfoot></tfoot>
            <!-- tfoot는 표의 바닥글을 나타내는 태그이다. -->

        <tr>
            <th>번호</th>
            <th>이름</th>
            <th>나이</th>
        </tr>

        <tr>
            <td colspan="2">1</td>
            <!-- colspan은 셀을 가로로 합치는 속성이다. -->
            <td>홍길동</td>
            <!--<td>20</td>-->
        </tr>

        <tr>
            <td>2</td>
            <td>이순신</td>
            <td rowspan="2">30</td>
            <!-- rowspan은 셀을 세로로 합치는 속성이다. -->
        </tr>

        <tr>    
            <td>3</td>
            <td>강감찬</td>
            <!--<td>40</td>-->
        </tr>    
    </table>

    <h1>새 탭에서 링크 열기</h1>
    <a href="https://www.naver.com" target="_blank">새탭에서 네이버 열기</a>
    <br />
    <a href="https://www.naver.com" target="_top">전체화면으로 네이버 열기</a>
    </body>
</html>
