<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basicpractice</title>
</head>
<body>
    <!--기초문제 1~10-->
    <form action="" method="post">
        
        <fieldset>
            <legend>회원가입</legend>
            <li>
            <label for="name">이름</label>
            <input type="text" id="name" name="name" />
            </li>

            <li>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" />
            </li>
            
            <li>
            <label for ="passwrod">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호"/>
            </li>
            
            <li>
            <label for ="password2">비밀번호 확인</label>
            <input type="password" id="password2" name="password2" placeholder="비밀번호 확인"/>
            </li>
            
            <li>
            <label for = "date">생년월일</label>
            <input type="date" id="date" name="date" />
            </li>

            <li>
                <label for="agree">뉴스레터 수신에 동의합니다</label>
                <input type="checkbox" id="agree" name="agree" />
            </li>

            <li>
                <label>
                    <input type="radio" name="gender"> 남자
                </label>
                <label>
                    <input type="radio" name="gender"> 여자
                </label>
            </li>

            <li>
                <label for="country">국가</label>
                <select id="country" name="country">
                    <option value="korea">대한민국</option>
                    <option value="usa">미국</option>
                    <option value="japan">일본</option>
                    <option value="china">중국</option>
                </select>
            </li>

            <li>
                <label for="textarea">자기소개</label>
                <textarea id="textarea" name="textarea" rows="5" cols="50" placeholder="자기소개를 입력하세요" >       
                </textarea>
            </li>

            <li>
                <label for="file">프로필 사진 업로드</label>
                <input type="file" id="file" name="file" />
            </li>

            <li>
                <label for="range">음량 조절</label>
                <input type="range" id="range" name="range" min="0" max="100" />
            </li>

            <button type="submit">Submit</button>

        </fieldset>
    </form>
</body>
</html>
