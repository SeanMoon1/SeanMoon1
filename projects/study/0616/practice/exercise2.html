<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> 수습 국원 지원 양식 </h1>
    <form action="" method="post">
        <table border="1" width="450" height="200">
            <tr>
                <td rowspan="3">개인정보</td>
                <td>
                    <label for="name">이름</label>
                    </td>
                    <td>
                    <input type="text" 
                        id="name" 
                        name="name"
                />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="department">학과/학번</label>
                    </td>
                    <td>
                    <input type="text" 
                        id="department" 
                        name="department"
                />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="contact">연락처</label>
                    </td>
                <td>
                    <input type="text" 
                        id="contact" 
                        name="contact"
                />
                </td>
            </tr>
            <tr>
                <td>지원 분야</td>
                <td colspan ="2">
                    <input type ="text" />
                </td>
            </tr>
        </table>
        <input type="submit" value="전송" />
    </form>
</body>
</html>
