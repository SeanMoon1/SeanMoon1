<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 and CSS Module</title>
    <style>
        .css3{
            animation: css3 10s infinite;
        }

        @keyframes css3{
            from{background-color: red;}
            to{background-color: yellow;}
        }


        .box{
            width : 100px;
            height : 100px;
            background-color : lightblue;
            /* 회전 */
            transform: rotateX(45deg);
            transform: rotateY(45deg);
            transform: rotateZ(45deg);
            transform-origin: center;
            transform-style: preserve-3d;
            /* 좌표 이동 */
            transform: translateX(500px) translateY(300px);
             /* 기울이기 */
            transform: skewX(20deg) skewY(20deg);
            /* 크기 조정 */
            transform: scale(2, 2);
           
            
        }
         /* 그라디언트 */
        .gradient{
            background: linear-gradient(to right, red, yellow);
        }
        
        /* 미디어 쿼리 */
        /* 화면 크기에 따라 다른 스타일 적용 */
        /* 모바일 화면에서 글자 크기와 배경색 변경 */
        @media (max-width: 767px) {
            .box {
                font-size: 16px;
                background-color: lightgreen;
            }
        }
        /* 태블릿 화면에서 글자 크기와 배경색 변경 */
        @media (min-width: 768px) and (max-width: 1024px) {
            .box {
                font-size: 18px;
                background-color: lightcoral;
            }
        }
        /* 데스크톱 화면에서 글자 크기와 배경색 변경 */
        @media (min-width: 1024px) {
            .box {
                font-size:20px;
                background-color: lightblue;
            }
        }
    </style>
</head>
<body>
    <h1>CSS3 and CSS Module</h1>
    <div class="css3 box">CSS3</div>
    <div class="box">Box</div>
</body>
</html>
