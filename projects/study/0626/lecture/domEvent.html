<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DOM Event 예제</title>
        <style>
            #map {
                width : 500px;
                height: 500px;
                background-color: #F0F0F0;
            }
            
            #character {
                width: 50px;
                height: 50px;
                background-color: #FF0000;
                position: absolute;
                top: 0;
                left: 0;
            }
        </style>
    </head>
    <body>
        <div id="map"></div> <!--전체 화면-->
        <script>
           // 키보드 방향키에 따라 div가 상하좌우로 이동하게 만들기
           let character = document.createElement("div"); //태그를 추가해서 생성한것
           let map = document.getElementById("map"); //부모요소를 포함해야해서 가져온것
           
           character.id = "character"; //id 부여작업
           
           map.appendChild(character);

           document.addEventListener("keydown", function (event){
            if (event.key === "ArrowUp"){
                character.style.top = character.offsetTop - 10 + "px";
            } else if (event.key === "ArrowDown"){
                character.style.top = character.offsetTop + 10 + "px";
            } else if (event.key === "ArrowLeft") {
                character.style.left = character.offsetLeft - 10 + "px";
            } else if (event.key === "ArrowRight") {
                character.style.left = character.offsetLeft + 10 + "px";
            }
           });
        </script>
    </body>
</html>
