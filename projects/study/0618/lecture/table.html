<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Table</title>
        <style>
            table {
                width: 100%;
                margin: 10px auto 10px;
                border-collapse: collapse;
            }
            th, td {
                padding: 10px;
                border: 1px solid #ddd;
                text-align: center;
            }
            th {
                background-color: #F2F2F2;
            }
            tr:nth-child(odd) {
                background-color: #F9F9F9;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <th>번호</th>
                <th>이름</th>
                <th>연락처</th>
                <th>이메일</th>
                <th>0618</th>
                <th>0619</th>
            </tr>
            <tr>
                <td>1</td>
                <td>홍길동</td>
                <td>010-9876-5432</td>
                <td>hong@tmd.com</td>
                <td>O</td>
                <td></td>
            </tr>
            <tr>
                <td>2</td>
                <td>임꺽정</td>
                <td>010-5432-9876</td>
                <td>rim@tmd.com</td>
                <td>O</td>
                <td></td>
            </tr>
            <tr>
                <td>3</td>
                <td>전우치</td>
                <td>010-1234-5678</td>
                <td>jeon@tmd.com</td>

                <td></td>
            </tr>
        </table>
    </body>
</html>
