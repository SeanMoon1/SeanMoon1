<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: #FF0000;
            /*margin: 4px;*/
        }
        .box1 {
            background-color: #FF0000;
            /*float: left;*/
            /*width: 20px;*/
            /*position: static;
            top: 10px;
            left: 10px;*/
        }
        .box2 {
            background-color: #00FF00;
            position: relative;
            top: 10px;
            left: 10px;
        }
        .box3 {
            background-color: #0000ff;
            position: absolute;
            top: 30px;
            left: 30px;
        }
        .box4 {
            background-color: #FF00FF;
            position: fixed;
            top: 30px;
            left: 30px;
        }
        .container{
            background-color: #FFF000
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1 box"></div>
        <div class="box2 box"></div>
        <div class="box3 box"></div>
         <div class="box4 box"></div>
        <div class="box"></div>
        <div class="box"></div>
         <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
