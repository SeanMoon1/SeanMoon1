<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>
        <style>
            .calculator {
                border: 5px;
                border-color: #000000;
                border-radius: 10px;
                background-color: #FFFFFF;
                box-shadow : 4px 4px 10px rgba(0,0,0,0.5);
                margin: auto;
                padding: 16px;
                width: 288px;
            }
            .display{
                background-color: #000000;
                color: #FFFFFF;
                padding: 16px;
                font-size: 32px;
                text-align: end;
            }
            button{
                margin: 16px, 4px, 4px, 4px;
                width: 60px;
            }

        </style>
    </head>
    <body>
        <div class="calculator">
            <div class="display">0</div>
            <div class="buttons">
                <button>C</button>
                <button><=</button>
                <button>%</button>
                <button>/</button>

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>*</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>

                <button>0</button>
                <button>.</button>
                <button class="equal">=</button>
            </div>
        </div>
    </body>
</html>
